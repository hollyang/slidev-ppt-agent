<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slidev Local Web Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Slidev Local Web Studio</h1>
      <p>输入需求 -> 生成 -> 调整 -> 导出</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>需求输入</h2>
        <label for="promptInput">需求描述</label>
        <textarea id="promptInput" class="input-area" placeholder="例如：输出最近一周 AI 新论文综述，适合技术管理层汇报"></textarea>

        <label for="apiKeyInput">Gemini API Key（仅内存会话，不落盘）</label>
        <input id="apiKeyInput" type="password" class="text-input" placeholder="可选：本次会话使用" />

        <label class="checkbox">
          <input id="skipQaInput" type="checkbox" />
          跳过质量校验（不建议）
        </label>

        <div class="row">
          <button id="generateBtn" class="primary">开始生成</button>
          <button id="refreshBtn">刷新状态</button>
        </div>
        <p id="runtimeHint" class="hint">状态：初始化中...</p>
      </section>

      <section class="panel">
        <h2>可视化配置</h2>
        <form id="configForm">
          <label for="brandInput">品牌</label>
          <input id="brandInput" type="text" class="text-input" />

          <label for="subtitleInput">副标题</label>
          <input id="subtitleInput" type="text" class="text-input" />

          <label for="footerInput">页脚</label>
          <input id="footerInput" type="text" class="text-input" />

          <div class="grid-2">
            <div>
              <label for="primaryColorInput">主色</label>
              <input id="primaryColorInput" type="text" class="text-input" />
            </div>
            <div>
              <label for="accentColorInput">强调色</label>
              <input id="accentColorInput" type="text" class="text-input" />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label for="fontInput">字体</label>
              <input id="fontInput" type="text" class="text-input" />
            </div>
            <div>
              <label for="modelInput">模型</label>
              <input id="modelInput" type="text" class="text-input" />
            </div>
          </div>

          <div class="grid-3">
            <div>
              <label for="timeoutInput">超时(ms)</label>
              <input id="timeoutInput" type="number" class="text-input" min="1000" />
            </div>
            <div>
              <label for="retryInput">重试次数</label>
              <input id="retryInput" type="number" class="text-input" min="1" />
            </div>
            <div>
              <label for="formatInput">默认导出</label>
              <select id="formatInput" class="text-input">
                <option value="pdf">pdf</option>
                <option value="pptx">pptx</option>
                <option value="both">both</option>
              </select>
            </div>
          </div>

          <button type="submit" class="primary">保存配置</button>
        </form>
      </section>

      <section class="panel full">
        <div class="row space-between">
          <h2>可视化工作过程</h2>
          <div class="row">
            <button data-export="pdf">导出 PDF</button>
            <button data-export="pptx">导出 PPTX</button>
            <button data-export="both">导出全部</button>
          </div>
        </div>
        <div id="stepView" class="steps"></div>
        <pre id="logView" class="log-box"></pre>
      </section>

      <section class="panel full">
        <div class="row space-between">
          <h2>PPT 预览</h2>
          <div class="row">
            <button id="startPreviewBtn" class="primary">启动预览</button>
            <button id="stopPreviewBtn">停止预览</button>
            <button id="reloadPreviewBtn">刷新预览</button>
            <button id="openPreviewBtn">新窗口打开</button>
          </div>
        </div>
        <p id="previewHint" class="hint">预览服务状态：未启动</p>
        <iframe id="previewFrame" class="preview-frame" title="Slidev Preview"></iframe>
      </section>

      <section class="panel full">
        <div class="row space-between">
          <h2>slides.md 编辑区</h2>
          <button id="saveSlidesBtn" class="primary">保存 slides.md</button>
        </div>
        <textarea id="slidesInput" class="editor"></textarea>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
  </html>
